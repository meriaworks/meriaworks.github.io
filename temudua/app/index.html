    <title>TemuDua — Hidup Berdua Lebih Tertata</title>
    <script>
      // Applies the saved theme before first paint. Without this the app paints
      // the default palette and then repaints the chosen one, which reads as a
      // flash of the wrong colour on every single launch.
      try {
        var t = localStorage.getItem('temudua.theme')
        if (t && ['pastel','ceria','senja','embun','malam'].indexOf(t) > -1) {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    </script>
